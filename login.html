<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UTC | Iniciar sesión</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-brand-panel">
      <div class="login-brand-mark">UTC</div>
      <h1>Control de Incidencias Docentes</h1>
      <p>Registro, seguimiento y análisis de incidencias operativas y administrativas.</p>
    </section>

    <section class="login-card">
      <div>
        <span class="login-eyebrow">Acceso al sistema</span>
        <h2>Iniciar sesión</h2>
        <p class="help">Ingresa con el usuario y la contraseña asignados.</p>
      </div>

      <form id="loginForm">
        <div class="field">
          <label for="loginUser">Usuario</label>
          <input id="loginUser" autocomplete="username" required placeholder="Ej. admin u operativo1">
        </div>
        <div class="field">
          <label for="loginPassword">Contraseña</label>
          <input id="loginPassword" type="password" autocomplete="current-password" required placeholder="Tu contraseña">
        </div>
        <p id="loginError" class="login-error" hidden></p>
        <button id="loginButton" class="btn btn-primary login-submit" type="submit">Entrar</button>
      </form>

      <p class="login-note">El acceso se valida de forma segura contra la tabla de usuarios de Supabase.</p>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      const config = window.APP_CONFIG || {};
      const errorBox = document.getElementById('loginError');
      const button = document.getElementById('loginButton');
      const previousSession = JSON.parse(localStorage.getItem('utc_docentes_session') || 'null');

      if (previousSession?.id && previousSession?.username) {
        window.location.replace('index.html');
        return;
      }

      if (!window.supabase || !config.SUPABASE_URL || !config.SUPABASE_ANON_KEY ||
          config.SUPABASE_URL.includes('PEGA_AQUI') || config.SUPABASE_ANON_KEY.includes('PEGA_AQUI')) {
        errorBox.hidden = false;
        errorBox.textContent = 'Falta colocar la URL y la clave pública de Supabase en config.js.';
        button.disabled = true;
        return;
      }

      const db = window.supabase.createClient(config.SUPABASE_URL, config.SUPABASE_ANON_KEY, {
        auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
      });

      document.getElementById('loginForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        errorBox.hidden = true;
        button.disabled = true;
        button.textContent = 'Ingresando...';

        const usuario = document.getElementById('loginUser').value.trim();
        const contrasena = document.getElementById('loginPassword').value;

        try {
          const { data, error } = await db.rpc('validar_acceso', {
            p_usuario: usuario,
            p_contrasena: contrasena
          });

          if (error) throw error;
          const user = Array.isArray(data) ? data[0] : data;
          if (!user) throw new Error('Usuario o contraseña incorrectos.');
          if (user.activo === false) throw new Error('Este usuario está desactivado.');

          const initials = String(user.nombre || user.usuario || 'US')
            .split(/\s+/).filter(Boolean).slice(0, 2).map(part => part[0]).join('').toUpperCase();

          localStorage.setItem('utc_docentes_session', JSON.stringify({
            id: user.id,
            username: user.usuario,
            name: user.nombre,
            role: user.rol,
            initials,
            loginAt: new Date().toISOString()
          }));

          window.location.replace('index.html');
        } catch (error) {
          console.error(error);
          errorBox.hidden = false;
          errorBox.textContent = error.message || 'No se pudo iniciar sesión.';
        } finally {
          button.disabled = false;
          button.textContent = 'Entrar';
        }
      });
    })();
  </script>
</body>
</html>
